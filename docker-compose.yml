services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: campus_helpdesk
      POSTGRES_USER: helpdesk
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-helpdesk-local-only}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U helpdesk -d campus_helpdesk"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - helpdesk_data:/var/lib/postgresql/data

  backend:
    build:
      context: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg://helpdesk:${POSTGRES_PASSWORD:-helpdesk-local-only}@db:5432/campus_helpdesk
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/ready')"]
      interval: 10s
      timeout: 5s
      retries: 6
    ports:
      - "8000:8000"

  frontend:
    build:
      context: ./frontend
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "3000:8080"

  prometheus:
    image: prom/prometheus:v3.1.0
    profiles: ["observability"]
    command: ["--config.file=/etc/prometheus/prometheus.yml"]
    volumes:
      - ./monitoring/prometheus-compose.yml:/etc/prometheus/prometheus.yml:ro
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "9090:9090"

  grafana:
    image: grafana/grafana:11.5.1
    profiles: ["observability"]
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-helpdesk-local-only}
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboard.json:/var/lib/grafana/dashboards/campus-helpdesk.json:ro
    depends_on:
      - prometheus
    ports:
      - "3001:3000"

volumes:
  helpdesk_data:
