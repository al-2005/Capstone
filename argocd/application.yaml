apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: campus-helpdesk
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/CHANGE-ME/campus-helpdesk.git
    targetRevision: main
    path: helm/campus-helpdesk
    helm:
      releaseName: campus-helpdesk
      valueFiles:
        - values.yaml
      parameters:
        - name: serviceMonitor.enabled
          value: "true"
  destination:
    server: https://kubernetes.default.svc
    namespace: campus-helpdesk
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
