image:
  backend:
    repository: ghcr.io/CHANGE-ME/campus-helpdesk-backend
    tag: latest
    pullPolicy: IfNotPresent
  frontend:
    repository: ghcr.io/CHANGE-ME/campus-helpdesk-frontend
    tag: latest
    pullPolicy: IfNotPresent

imagePullSecrets: []

replicaCount:
  backend: 2
  frontend: 2

service:
  backend:
    port: 8000
  frontend:
    port: 80

resources:
  backend:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi
  frontend:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 250m
      memory: 128Mi

autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 6
  targetCPUUtilizationPercentage: 60

postgres:
  enabled: true
  image: postgres:16-alpine
  database: campus_helpdesk
  username: helpdesk
  password: helpdesk-local-only
  storage: 2Gi

ingress:
  enabled: true
  className: nginx
  host: helpdesk.local
  tls: []

serviceMonitor:
  enabled: false
  interval: 30s
  scrapeTimeout: 10s
