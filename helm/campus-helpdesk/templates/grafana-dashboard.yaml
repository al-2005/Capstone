{{- if .Values.serviceMonitor.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Release.Name }}-grafana-dashboard
  labels:
    {{- include "helpdesk.labels" . | nindent 4 }}
    grafana_dashboard: "1"
data:
  campus-helpdesk.json: |-
    {{- .Files.Get "files/dashboard.json" | nindent 4 }}
{{- end }}
